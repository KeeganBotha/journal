name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values that satisfy config.ts's Zod validation — the build never
      # connects to a database (all user-facing routes are dynamic) and
      # migrations are NOT run here (Vercel's build applies them with real env).
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-value-32-characters-min
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      VAPID_PUBLIC_KEY: ci
      VAPID_PRIVATE_KEY: ci
      VAPID_SUBJECT: mailto:ci@example.com
      CRON_SECRET: ci-only-cron-secret-value
      APP_TIMEZONE: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npx next build
